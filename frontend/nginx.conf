worker_processes auto;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log off;
    error_log /dev/stderr warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    font/ttf
    font/otf
    image/svg+xml;

    # SSL / TLS settings (Mozilla "Intermediate" profile, practical and compatible)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Cipher suite for TLS1.2 (TLS1.3 ciphers are negotiated separately)
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # Resolver for OCSP stapling (public resolvers are fine; ensure container can reach them)
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    ################################################################
    # HTTP -> HTTPS redirect (container port 8080 -> mapped to host:80)
    ################################################################
    server {
        listen 8080;
        server_name _;

        # Redirect to HTTPS
        return 301 https://$host$request_uri;
    }


    ################################################################
    # HTTPS server (container port 8443 -> mapped to host:443)
    ################################################################
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate /etc/ssl/certs/fullchain.pem;
        ssl_certificate_key /etc/ssl/private/privkey.pem;

        # Trusted certificate for OCSP stapling (should contain issuer chain / intermediates)
        # Some CAs provide a separate chain file; if so, use that here.
        ssl_trusted_certificate /etc/ssl/certs/fullchain.pem;

        # OCSP stapling (best-effort; responder must be reachable)
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers (practical defaults)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self' https://localhost:5000;" always;

        # Angular routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static assets caching
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
        }

        error_page 404 /index.html;
    }
}
