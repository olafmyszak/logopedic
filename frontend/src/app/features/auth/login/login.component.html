<main class="login-root" role="main">
    <form (submit)="onSubmit()" [formGroup]="form" class="login-card" novalidate>
        <h1 class="title">Sign in</h1>

        <label class="label" for="email">Email</label>
        <input autocomplete="username" formControlName="email" id="email" type="email"/>
        @if (emailError()) {
            <div class="error">{{ emailError() }}</div>
        }

        <label class="label" for="password">Password</label>
        <input autocomplete="current-password" formControlName="password" id="password" type="password"/>
        @if (passwordError()) {
            <div class="error">{{ passwordError() }}</div>
        }

        <label class="inline">
            Remember me
            <input formControlName="rememberMe" type="checkbox"/>
        </label>

        <button [disabled]="isLoading() || form.invalid" type="submit">
            {{ isLoading() ? 'Signing in...' : 'Sign in' }}
        </button>

        @if (serverError()) {
            <div class="server-error">{{ serverError() }}</div>
        }
    </form>
</main>
