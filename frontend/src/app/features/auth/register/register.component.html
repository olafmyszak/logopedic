<main class="register-root" role="main">
    <form (submit)="onSubmit()" [formGroup]="form" class="register-card" novalidate>
        <h1 class="title">Sign up</h1>

        <label class="label" for="fullName">Full name</label>
        <input formControlName="fullName" id="fullName" type="text"/>
        @if (fullNameError()) {
            <div class="error">{{ fullNameError() }}</div>
        }

        <label class="label" for="email">Email</label>
        <input formControlName="email" id="email" type="email"/>
        @if (emailError()) {
            <div class="error">{{ emailError() }}</div>
        }

        <label class="label" for="password">Password</label>
        <input formControlName="password" id="password" type="password"/>
        @if (passwordError()) {
            <div class="error">{{ passwordError() }}</div>
        }

        <label class="label" for="confirmPassword">Confirm password</label>
        <input formControlName="confirmPassword" id="confirmPassword" type="password"/>
        @if (confirmPasswordError()) {
            <div class="error">{{ confirmPasswordError() }}</div>
        }

        <button [disabled]="isLoading() || form.invalid" type="submit">
            {{ isLoading() ? 'Signing up...' : 'Sign up' }}
        </button>

        @if (serverError()) {
            <div class="server-error">{{ serverError() }}</div>
        }
    </form>
</main>
