services:
  backend:
    build:
      context: ./backend/src
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    environment:
      - PFX_PATH=/var/ssl/private/localhost.pfx
    volumes:
      - ./backend/aspnet-keys:/keys
      - ./backend/localhost.pfx:/var/ssl/private/localhost.pfx:ro
    env_file: "backend/backend.env"
    restart: unless-stopped

  postgres:
    image: postgres:17
    env_file: "db.env"
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
